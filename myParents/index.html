<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>長輩友善 YouTube 搜尋工具</title>
    <style>
        body {
            font-family: '微軟正黑體', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            line-height: 1.6;
            background-color: #f0f0f0;
            font-size: 18px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #005CAA;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
        }
        .search-section {
            margin-bottom: 20px;
        }
        #keywords {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        #search-btn {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            background-color: #005CAA;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #search-btn:hover {
            background-color: #0056b3;
        }
        .filter-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        #max-results {
            font-size: 22px;
            padding: 10px;
        }
        #results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #result-count {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 20px;
        }
        .video-item {
            display: flex;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: box-shadow 0.3s ease;
        }
        .video-item:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .video-title {
            flex-grow: 1;
            font-size: 24px;
            color: #1A73E8;
            margin-right: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 4.8em;
            line-height: 1.2;
            cursor: help;
        }
        .video-details {
            display: flex;
            flex-direction: column;
            min-width: 250px;
            font-size: 20px;
            color: #666;
        }
        .video-details p {
            margin: 5px 0;
        }
        .video-link {
            background-color: #DC3545;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            align-self: flex-start;
            margin-top: 10px;
            font-size: 20px;
            transition: background-color 0.3s ease;
        }
        .video-link:hover {
            background-color: #C82333;
        }
        #loading, #error {
            text-align: center;
            font-size: 24px;
            margin: 30px 0;
        }
        #error {
            color: red;
        }
        @media (max-width: 768px) {
            .video-item {
                flex-direction: column;
                align-items: start;
            }
            .video-title {
                margin-right: 0;
                margin-bottom: 10px;
            }
            .video-details {
                width: 100%;
            }
        }
        .default-keyword, .recent-keyword {
            display: inline-block;
            margin: 0 10px 10px 0;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .default-keyword {
            background-color: #28A745;
            color: white;
        }
        .default-keyword:hover {
            background-color: #218838;
        }
        .recent-keyword {
            background-color: #007bff;
            color: white;
        }
        .recent-keyword:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>長輩友善 YouTube 搜尋工具</h1>
        
        <div class="search-section">
            <input type="text" id="keywords" placeholder="請輸入搜尋關鍵字" required>
            
            <div class="filter-section">
                <select id="max-results" style="font-size: 22px; padding: 5px;">
                    <option value="10">10 部</option>
                    <option value="20">20 部</option>
                    <option value="50">50 部</option>
                    <option value="100" selected>100 部</option>
                    <option value="200">200 部</option>
                </select>
            </div>

            <button id="search-btn">開始搜尋</button>
        </div>
        
        <div id="loading" style="display: none;">載入中，請稍候...</div>
        <div id="error"></div>
        <div id="result-count"></div>
        <div id="results"></div>
    </div>

    <script src="api-config.js"></script>
    <script>
        // 初始預設關鍵字組合
        const defaultKeywordSets = [
            '一口氣 陸劇',
            '一口氣 武俠',
			'一口氣 古裝',
			'一口氣 仙俠',
            '一口氣 宮鬥',
            '一口氣 看完'
        ];

        // 獲取頁面元素
        const keywordsInput = document.getElementById('keywords');
        const searchBtn = document.getElementById('search-btn');
        const resultsContainer = document.getElementById('results');
        const loadingIndicator = document.getElementById('loading');
        const errorContainer = document.getElementById('error');
        const resultCountContainer = document.getElementById('result-count');
        const maxResultsSelect = document.getElementById('max-results');

        // 等待外部 api-config.js 載入
        document.addEventListener('DOMContentLoaded', () => {
            // 使用 window.API_KEY（來自外部 api-config.js）
            if (!window.API_KEY || window.API_KEY === 'YOUR_YOUTUBE_DATA_API_KEY') {
                errorContainer.textContent = '請設定有效的 YouTube Data API Key';
            }

            // 在頁面載入時創建預設和最近關鍵字
            createDefaultKeywordButtons();
            loadRecentKeywords();
        });

        // 創建預設關鍵字按鈕
        function createDefaultKeywordButtons() {
            const defaultKeywordsContainer = document.createElement('div');
            defaultKeywordsContainer.id = 'default-keywords';
            defaultKeywordsContainer.style.marginBottom = '15px';
            
            const label = document.createElement('div');
            label.textContent = '推薦搜索：';
            label.style.marginBottom = '10px';
            label.style.fontWeight = 'bold';
            defaultKeywordsContainer.appendChild(label);

            defaultKeywordSets.forEach(keywords => {
                const keywordEl = document.createElement('span');
                keywordEl.classList.add('default-keyword');
                keywordEl.textContent = keywords;
                
                keywordEl.addEventListener('click', () => {
                    keywordsInput.value = keywords;
                });
                
                defaultKeywordsContainer.appendChild(keywordEl);
            });

            document.querySelector('.search-section').insertBefore(defaultKeywordsContainer, keywordsInput);
        }

        // 加載最近搜索的關鍵字
        function loadRecentKeywords() {
            const recentKeywords = JSON.parse(localStorage.getItem('recentYouTubeKeywords') || '[]');
            
            // 先移除可能已存在的容器
            const existingContainer = document.getElementById('recent-keywords');
            if (existingContainer) {
                existingContainer.remove();
            }
            
            const recentKeywordsContainer = document.createElement('div');
            recentKeywordsContainer.id = 'recent-keywords';
            recentKeywordsContainer.style.marginBottom = '15px';
            
            if (recentKeywords.length > 0) {
                const label = document.createElement('div');
                label.textContent = '最近搜索：';
                label.style.marginBottom = '10px';
                label.style.fontWeight = 'bold';
                recentKeywordsContainer.appendChild(label);
            }

            recentKeywords.slice(0, 10).forEach(keyword => {
                const keywordEl = document.createElement('span');
                keywordEl.classList.add('recent-keyword');
                keywordEl.textContent = keyword;
                
                keywordEl.addEventListener('click', () => {
                    keywordsInput.value = keyword;
                });
                
                recentKeywordsContainer.appendChild(keywordEl);
            });

            document.querySelector('.search-section').insertBefore(recentKeywordsContainer, keywordsInput);
        }

        // 保存最近搜索的關鍵字
        function saveRecentKeywords(keywords) {
            const recentKeywords = JSON.parse(localStorage.getItem('recentYouTubeKeywords') || '[]');
            
            // 移除已存在的關鍵字，並將新關鍵字加在最前面
            const updatedKeywords = [
                keywords, 
                ...recentKeywords.filter(k => k !== keywords)
            ].slice(0, 10);

            localStorage.setItem('recentYouTubeKeywords', JSON.stringify(updatedKeywords));
            loadRecentKeywords();
        }

		// 搜索事件監聽器
		searchBtn.addEventListener('click', async () => {
			// ... 之前的檢查代碼 ...

			const keywords = keywordsInput.value.trim();
			const maxResultsSelect = document.getElementById('max-results');
			const maxResults = parseInt(maxResultsSelect.value);
			
			// 重置之前的結果和錯誤
			resultsContainer.innerHTML = '';
			errorContainer.textContent = '';
			resultCountContainer.textContent = '';
			loadingIndicator.style.display = 'block';
			
			try {
				// 保存本次搜索的關鍵字
				if (keywords) {
					saveRecentKeywords(keywords);
				}

				let allVideos = [];
				let nextPageToken = '';
				let totalFetched = 0;

				// 持續獲取頁面直到達到所需數量
				while (totalFetched < maxResults) {
					// 計算這次請求的數量
					const remainingResults = maxResults - totalFetched;
					const currentPageSize = Math.min(50, remainingResults);

					// 搜尋影片
					const response = await fetch(
						`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=50&q=${encodeURIComponent(keywords)}&type=video&key=${window.API_KEY}${nextPageToken ? `&pageToken=${nextPageToken}` : ''}`
					);
					
					if (!response.ok) {
						throw new Error(`搜索失敗：${response.status} ${response.statusText}`);
					}
					
					const data = await response.json();
					
					// 如果沒有更多結果
					if (!data.items || data.items.length === 0) {
						break;
					}

					// 獲取影片詳細信息
					const videoIds = data.items.map(item => item.id.videoId).join(',');
					const [statsResponse, contentResponse] = await Promise.all([
						fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds}&key=${window.API_KEY}`),
						fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds}&key=${window.API_KEY}`)
					]);
					
					const statsData = await statsResponse.json();
					const contentData = await contentResponse.json();
					
					// 處理和篩選影片
					const processedVideosPage = data.items
						.map((item, index) => {
							const videoStats = statsData.items[index];
							const videoContent = contentData.items[index];
							
							// 計算影片時長
							const duration = videoContent.contentDetails.duration;
							const matches = duration.match(/PT(\d+)H?(\d+)?M?(\d+)?S?/);
							
							let totalMinutes = 0;
							if (matches) {
								const hours = matches[1] ? parseInt(matches[1]) : 0;
								const minutes = matches[2] ? parseInt(matches[2]) : 0;
								const seconds = matches[3] ? parseInt(matches[3]) : 0;
								totalMinutes = hours * 60 + minutes + (seconds > 0 ? 1 : 0);
							}
							
							return {
								item,
								viewCount: videoStats.statistics ? parseInt(videoStats.statistics.viewCount) : 0,
								duration: totalMinutes
							};
						})
						// 篩選：時長大於等於20分鐘
						.filter(video => video.duration >= 20);

					// 累加影片
					allVideos = allVideos.concat(processedVideosPage);
					totalFetched += processedVideosPage.length;

					// 更新分頁標記
					nextPageToken = data.nextPageToken;

					// 如果沒有更多頁面，跳出循環
					if (!nextPageToken) {
						break;
					}
				}

				// 按觀看次數排序（由多到少）
				allVideos.sort((a, b) => b.viewCount - a.viewCount);

				// 限制最終結果數量
				const finalVideos = allVideos.slice(0, maxResults);
				
				// 更新結果統計
				resultCountContainer.textContent = `搜索「${keywords}」：共找到 ${finalVideos.length} 筆資料`;
				
				// 顯示篩選後的影片
				finalVideos.forEach(({item, viewCount, duration}) => {
					const videoItem = document.createElement('div');
					videoItem.classList.add('video-item');
					
					videoItem.innerHTML = `
						<div class="video-title" title="${item.snippet.title}">${item.snippet.title}</div>
						<div class="video-details">
							<p>頻道：${item.snippet.channelTitle}</p>
							<p>影片時長：${duration} 分鐘</p>
							<p>觀看次數：${viewCount.toLocaleString()} 次</p>
							<a href="https://www.youtube.com/watch?v=${item.id.videoId}" 
							   class="video-link" 
							   target="_blank">觀看影片</a>
						</div>
					`;
					
					resultsContainer.appendChild(videoItem);
				});
				
				// 如果篩選後沒有結果
				if (finalVideos.length === 0) {
					errorContainer.textContent = '未找到符合條件的影片';
				}
			} catch (error) {
				console.error('Complete search error:', error);
				errorContainer.textContent = `發生錯誤：${error.message}`;
			} finally {
				loadingIndicator.style.display = 'none';
			}
		});
    </script>
</body>
</html>
