<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>長輩友善 YouTube 搜尋工具</title>
    <style>
        body {
            font-family: '微軟正黑體', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            line-height: 1.6;
            background-color: #f0f0f0;
            font-size: 22px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #005CAA;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            padding: 10px;
            background-color: #E6F2FF;
            border-radius: 10px;
        }
        #keywords {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            border: 2px solid #4A90E2;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: #F0F8FF;
        }
        #search-btn {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            background-color: #28A745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .filter-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        select {
            font-size: 22px;
            padding: 10px;
            background-color: #F0F8FF;
            border: 2px solid #4A90E2;
            border-radius: 10px;
        }
        .default-keyword {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            margin: 5px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .video-item {
            background-color: #F0F8FF;
            border: 2px solid #4A90E2;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .video-title {
            font-size: 26px;
            color: #1A73E8;
            margin-bottom: 10px;
        }
        .video-details {
            font-size: 22px;
            color: #005CAA;
        }
        .video-link {
            display: inline-block;
            background-color: #DC3545;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 22px;
            margin-top: 10px;
        }
        #loading, #error {
            text-align: center;
            font-size: 24px;
            color: #DC3545;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>長輩友善 YouTube 搜尋工具</h1>
        
        <div class="search-section">
            <input type="text" id="keywords" placeholder="請輸入搜尋關鍵字" required>
            
            <div class="filter-section">
                <select id="max-results">
                    <option value="10">10 部</option>
                    <option value="20">20 部</option>
                    <option value="50">50 部</option>
                    <option value="100" selected>100 部</option>
                    <option value="200">200 部</option>
                </select>
                <select id="sort-method">
                    <option value="date">按最新日期</option>				
                    <option value="views">按觀看次數</option>
                </select>
            </div>

            <button id="search-btn">開始搜尋</button>
        </div>
        
        <div id="loading" style="display:none;">載入中，請稍候...</div>
        <div id="error"></div>
        <div id="result-count"></div>
        <div id="results"></div>
    </div>

    <script src="api-config.js"></script>
    <script>
    // 預設關鍵字
    const defaultKeywordSets = [
        '一口氣 陸劇', '一口氣 武俠', 
        '一口氣 古裝', '一口氣 仙俠', 
        '一口氣 宮鬥', '一口氣 看完'
    ];

    // 創建預設關鍵字按鈕
    function createDefaultKeywordButtons() {
        const container = document.createElement('div');
        container.style.marginBottom = '15px';
        container.innerHTML = '<div style="font-weight:bold;color:#005CAA;">推薦搜索：</div>';
        
        defaultKeywordSets.forEach(keywords => {
            const button = document.createElement('span');
            button.className = 'default-keyword';
            button.textContent = keywords;
            button.onclick = () => document.getElementById('keywords').value = keywords;
            container.appendChild(button);
        });

        document.querySelector('.search-section').insertBefore(container, document.getElementById('keywords'));
    }

    // 解析影片時長
    function parseDuration(durationStr) {
        const matches = durationStr.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
        if (!matches) return 0;
        
        const hours = parseInt(matches[1] || 0);
        const minutes = parseInt(matches[2] || 0);
        const seconds = parseInt(matches[3] || 0);
        
        return hours * 60 + minutes + (seconds > 0 ? 1 : 0);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', createDefaultKeywordButtons);

    // 搜索事件
    document.getElementById('search-btn').addEventListener('click', async () => {
        const keywords = document.getElementById('keywords').value.trim();
        const maxResults = parseInt(document.getElementById('max-results').value);
        const sortMethod = document.getElementById('sort-method').value;
        const resultsContainer = document.getElementById('results');
        const loadingIndicator = document.getElementById('loading');
        const errorContainer = document.getElementById('error');
        const resultCountContainer = document.getElementById('result-count');

        resultsContainer.innerHTML = '';
        errorContainer.textContent = '';
        resultCountContainer.textContent = '';
        loadingIndicator.style.display = 'block';

        try {
            let allVideos = [];
            let nextPageToken = '';
            let totalFetched = 0;

            while (totalFetched < maxResults) {
                const searchResponse = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=50&q=${encodeURIComponent(keywords)}&type=video&key=${window.API_KEY}${nextPageToken ? `&pageToken=${nextPageToken}` : ''}`
                );
                
                if (!searchResponse.ok) throw new Error(`搜索失敗：${searchResponse.status}`);
                
                const searchData = await searchResponse.json();
                if (!searchData.items || searchData.items.length === 0) break;

                const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                
                const [statsResponse, contentResponse] = await Promise.all([
                    fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds}&key=${window.API_KEY}`),
                    fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds}&key=${window.API_KEY}`)
                ]);

                const statsData = await statsResponse.json();
                const contentData = await contentResponse.json();
                
			 const processedVideos = searchData.items
				.map((item, index) => {
					const duration = parseDuration(contentData.items[index].contentDetails.duration);
					const viewCount = parseInt(statsData.items[index].statistics.viewCount);
					
					return {
						item,
						viewCount,
						duration,
						publishedAt: new Date(item.snippet.publishedAt)
					};
				})
				.filter(video => video.duration >= 20 && video.viewCount >= 100);  // 增加观看次数过滤

                allVideos = allVideos.concat(processedVideos);
                totalFetched += processedVideos.length;

                nextPageToken = searchData.nextPageToken;
                if (!nextPageToken) break;
            }

            // 排序
            allVideos.sort(sortMethod === 'views' 
                ? (a, b) => b.viewCount - a.viewCount 
                : (a, b) => b.publishedAt - a.publishedAt
            );

            const finalVideos = allVideos.slice(0, maxResults);
            
            resultCountContainer.textContent = `搜索「${keywords}」：共找到 ${finalVideos.length} 筆資料`;
            
            finalVideos.forEach(({item, viewCount, duration, publishedAt}) => {
                const videoItem = document.createElement('div');
                videoItem.classList.add('video-item');
                
                videoItem.innerHTML = `
                    <div class="video-title">${item.snippet.title}</div>
                    <div class="video-details">
                        <p>頻道：${item.snippet.channelTitle}</p>
                        <p>影片時長：${duration} 分鐘</p>
                        <p>觀看次數：${viewCount.toLocaleString()} 次</p>
                        <p>發布日期：${publishedAt.toLocaleDateString()}</p>
                        <a href="https://www.youtube.com/watch?v=${item.id.videoId}" class="video-link" target="_blank">觀看影片</a>
                    </div>
                `;
                
                resultsContainer.appendChild(videoItem);
            });

            if (finalVideos.length === 0) {
                errorContainer.textContent = '未找到符合條件的影片';
            }
        } catch (error) {
            console.error('搜索錯誤:', error);
            errorContainer.textContent = `發生錯誤：${error.message}`;
        } finally {
            loadingIndicator.style.display = 'none';
        }
    });
    </script>
</body>
</html>
